<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .group-title { font: bold 16px sans-serif; fill: #2c3e50; }
      .node-text { font: 12px sans-serif; fill: #2c3e50; text-anchor: middle; }
      .api-text { font: 10px sans-serif; fill: #7f8c8d; text-anchor: middle; }
      .user-group { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; stroke-dasharray: 5,5; }
      .agent-group { fill: #e8f5e8; stroke: #27ae60; stroke-width: 2; stroke-dasharray: 5,5; }
      .admin-group { fill: #fef5e7; stroke: #f39c12; stroke-width: 2; stroke-dasharray: 5,5; }
      .user-node { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 8; }
      .frontend-node { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; rx: 8; }
      .java-node { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; rx: 8; }
      .python-node { fill: #f39c12; stroke: #e67e22; stroke-width: 2; rx: 8; }
      .llm-node { fill: #1abc9c; stroke: #16a085; stroke-width: 2; rx: 8; }
      .redis-node { fill: #e67e22; stroke: #d35400; stroke-width: 2; rx: 8; }
      .mysql-node { fill: #34495e; stroke: #2c3e50; stroke-width: 2; rx: 8; }
      .admin-node { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; rx: 8; }
      .node-text-white { font: 12px sans-serif; fill: white; text-anchor: middle; }
      .arrow { fill: none; stroke: #34495e; stroke-width: 2; marker-end: url(#arrowhead); }
      .bidirectional { fill: none; stroke: #34495e; stroke-width: 2; marker-end: url(#arrowhead); marker-start: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>

  <!-- 用户侧分组 -->
  <rect x="50" y="50" width="300" height="200" class="user-group"/>
  <text x="60" y="75" class="group-title">用户侧</text>

  <!-- 用户 -->
  <rect x="80" y="100" width="80" height="40" class="user-node"/>
  <text x="120" y="125" class="node-text-white">用户</text>

  <!-- 前端 UI -->
  <rect x="220" y="100" width="100" height="40" class="frontend-node"/>
  <text x="270" y="125" class="node-text-white">前端 UI</text>

  <!-- Java 核心业务微服务 -->
  <rect x="220" y="180" width="100" height="50" class="java-node"/>
  <text x="270" y="200" class="node-text-white">Java 核心</text>
  <text x="270" y="215" class="node-text-white">业务微服务</text>

  <!-- Agent 服务侧分组 -->
  <rect x="400" y="50" width="500" height="450" class="agent-group"/>
  <text x="410" y="75" class="group-title">Agent 服务侧</text>

  <!-- Python Agent 服务 -->
  <rect x="430" y="150" width="120" height="50" class="python-node"/>
  <text x="490" y="170" class="node-text-white">Python Agent</text>
  <text x="490" y="185" class="node-text-white">服务</text>

  <!-- LLM - OpenAI API -->
  <rect x="600" y="100" width="120" height="50" class="llm-node"/>
  <text x="660" y="120" class="node-text-white">LLM</text>
  <text x="660" y="135" class="node-text-white">OpenAI API</text>

  <!-- Redis - 会话缓存 -->
  <rect x="600" y="200" width="120" height="50" class="redis-node"/>
  <text x="660" y="220" class="node-text-white">Redis</text>
  <text x="660" y="235" class="node-text-white">会话缓存</text>

  <!-- Java 业务 API -->
  <rect x="600" y="300" width="120" height="50" class="java-node"/>
  <text x="660" y="320" class="node-text-white">Java 业务 API</text>
  <text x="660" y="335" class="node-text-white">(核心业务微服务)</text>

  <!-- 管理侧分组 -->
  <rect x="50" y="300" width="320" height="450" class="admin-group"/>
  <text x="60" y="325" class="group-title">管理侧</text>

  <!-- 管理员/开发者 -->
  <rect x="80" y="350" width="100" height="40" class="admin-node"/>
  <text x="130" y="375" class="node-text-white">管理员/开发者</text>

  <!-- Agent 控制台前端 -->
  <rect x="220" y="350" width="120" height="50" class="frontend-node"/>
  <text x="280" y="370" class="node-text-white">Agent 控制台</text>
  <text x="280" y="385" class="node-text-white">前端</text>

  <!-- Agent 控制台后端 -->
  <rect x="220" y="450" width="120" height="50" class="python-node"/>
  <text x="280" y="470" class="node-text-white">Agent 控制台</text>
  <text x="280" y="485" class="node-text-white">后端 (Java/Python)</text>

  <!-- MySQL 控制台数据库 -->
  <rect x="80" y="550" width="120" height="50" class="mysql-node"/>
  <text x="140" y="570" class="node-text-white">MySQL</text>
  <text x="140" y="585" class="node-text-white">(控制台数据库)</text>

  <!-- 连接线 -->
  <!-- 用户 <-> 前端 UI -->
  <line x1="160" y1="120" x2="220" y2="120" class="bidirectional"/>

  <!-- 前端 UI <-> Java 核心业务微服务 -->
  <line x1="270" y1="140" x2="270" y2="180" class="bidirectional"/>
  <text x="285" y="165" class="api-text">HTTP API</text>

  <!-- Java 核心业务微服务 -> Python Agent 服务 -->
  <line x1="320" y1="205" x2="430" y2="175" class="arrow"/>
  <text x="365" y="185" class="api-text">HTTP API</text>
  <text x="365" y="195" class="api-text">(请求/Hook)</text>

  <!-- Python Agent 服务 -> LLM -->
  <line x1="550" y1="160" x2="600" y2="140" class="arrow"/>
  <text x="580" y="145" class="api-text">LLM API</text>

  <!-- Python Agent 服务 <-> Redis -->
  <line x1="550" y1="185" x2="600" y2="215" class="bidirectional"/>
  <text x="580" y="205" class="api-text">读写</text>

  <!-- Python Agent 服务 -> Java 业务 API -->
  <line x1="550" y1="195" x2="600" y2="315" class="arrow"/>
  <text x="580" y="260" class="api-text">调用</text>

  <!-- Java 业务 API -> Java 核心业务微服务 (通过虚线表示) -->
  <line x1="600" y1="325" x2="320" y2="225" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 管理员 -> Agent 控制台前端 -->
  <line x1="180" y1="370" x2="220" y2="375" class="arrow"/>
  <text x="205" y="365" class="api-text">Web UI</text>

  <!-- Agent 控制台前端 <-> Agent 控制台后端 -->
  <line x1="280" y1="400" x2="280" y2="450" class="bidirectional"/>
  <text x="295" y="430" class="api-text">HTTP API</text>

  <!-- Agent 控制台后端 <-> MySQL -->
  <line x1="220" y1="475" x2="200" y2="575" class="bidirectional"/>
  <text x="205" y="530" class="api-text">读写</text>

  <!-- Agent 控制台后端 <-> Python Agent 服务 -->
  <line x1="340" y1="460" x2="430" y2="190" class="bidirectional"/>
  <text x="380" y="320" class="api-text">管理/调试 API</text>

  <!-- Python Agent 服务 -> Agent 控制台后端 -->
  <line x1="470" y1="200" x2="300" y2="450" class="arrow"/>
  <text x="360" y="350" class="api-text">发送日志/指标</text>
</svg>